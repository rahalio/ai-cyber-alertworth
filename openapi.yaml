openapi: 3.0.3
info:
  title: Alertworth
  version: 0.1.0
  description: >-
    Detection-economics operating system for Canadian enterprise SOCs. Alertworth
    scores alerts by expected loss if ignored versus analyst effort, fills a
    capacity-capped triage queue, back-tests auto-dismissal, and reports residual
    cyber risk to the board only as high as detection evidence is fresh.
  x-product-slug: ai-cyber-alertworth
  x-source: ai-in-cyber/deloitte-ca-en-smart-cyber-pov-aoda/
servers:
  - url: https://api.example.com
tags:
  - name: Events
    description: Ingested security events from SIEM, EDR, identity, and intel
  - name: Scoring
    description: Detection-economics scores and dismissal policy
  - name: Triage
    description: Capacity-capped queue and overflow routing
  - name: Investigations
    description: Cases, dispositions, and learning feedback
  - name: Baselines
    description: Behavioural baselines and anomaly detections
  - name: Controls
    description: Continuous control testing
  - name: Indicators
    description: KRIs with evidence freshness gates
  - name: Reporting
    description: Residual risk snapshots and committee packs
paths:
  /v1/events:
    get:
      operationId: listSecurityEvents
      tags: [Events]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: source
          in: query
          schema:
            type: string
            enum: [siem, edr, identity, threat_intel]
      responses:
        "200":
          description: Security events page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeSecurityEvent"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: ingestSecurityEvent
      tags: [Events]
      security:
        - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEventIngest"
      responses:
        "202":
          description: Event accepted for scoring
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeSecurityEvent"
  /v1/alerts:
    get:
      operationId: listAlerts
      tags: [Scoring]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: disposition
          in: query
          schema:
            type: string
            enum: [scored, dismissed, queued, investigating, closed]
        - name: minWorthScore
          in: query
          schema:
            type: number
            format: float
      responses:
        "200":
          description: Alerts with economic scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAlert"
  /v1/alerts/{alertId}/score:
    parameters:
      - $ref: "#/components/parameters/AlertId"
    get:
      operationId: getAlertEconomicScore
      tags: [Scoring]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Expected loss versus analyst effort
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeEconomicScore"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/dismissal-policies:
    get:
      operationId: listDismissalPolicies
      tags: [Scoring]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dismissal policies with back-test metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeDismissalPolicy"
    post:
      operationId: createDismissalPolicy
      tags: [Scoring]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissalPolicyCreate"
      responses:
        "201":
          description: Policy created; inactive until approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDismissalPolicy"
  /v1/dismissal-policies/{policyId}/approve:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    post:
      operationId: approveDismissalPolicy
      tags: [Scoring]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [approverId]
              properties:
                approverId:
                  type: string
                maxFalseDismissalRate:
                  type: number
                  format: float
      responses:
        "200":
          description: Policy approved for auto-dismissal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDismissalPolicy"
  /v1/dismissal-policies/{policyId}/back-test:
    parameters:
      - $ref: "#/components/parameters/PolicyId"
    post:
      operationId: runDismissalBackTest
      tags: [Scoring]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [windowDays]
              properties:
                windowDays:
                  type: integer
                  minimum: 7
                  maximum: 365
      responses:
        "200":
          description: Back-test result against historical true positives
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeDismissalBackTest"
  /v1/triage/shifts:
    get:
      operationId: listTriageShifts
      tags: [Triage]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Shifts with capacity and accountable lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeTriageShift"
    post:
      operationId: openTriageShift
      tags: [Triage]
      description: >-
        Opens a shift only when an accountable SOC lead is named. Capacity
        caps the human queue for the shift.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageShiftCreate"
      responses:
        "201":
          description: Shift opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeTriageShift"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/triage/queue:
    get:
      operationId: listTriageQueue
      tags: [Triage]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: shiftId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Capacity-capped triage queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeQueuedAlert"
  /v1/triage/queue/admit:
    post:
      operationId: admitAlertToQueue
      tags: [Triage]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alertId, shiftId]
              properties:
                alertId:
                  type: string
                shiftId:
                  type: string
      responses:
        "201":
          description: Alert admitted to queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeQueuedAlert"
        "409":
          description: Queue at capacity; overflow routing required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /v1/triage/overflow:
    post:
      operationId: routeOverflow
      tags: [Triage]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OverflowRouteCreate"
      responses:
        "201":
          description: Overflow routed explicitly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOverflowRoute"
  /v1/investigations:
    get:
      operationId: listInvestigations
      tags: [Investigations]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [open, investigating, closed]
      responses:
        "200":
          description: Investigation cases page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeInvestigationCase"
    post:
      operationId: openInvestigation
      tags: [Investigations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigationCaseCreate"
      responses:
        "201":
          description: Case opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeInvestigationCase"
  /v1/investigations/{caseId}/disposition:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: disposeInvestigation
      tags: [Investigations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DispositionCreate"
      responses:
        "200":
          description: Disposition recorded for scoring feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeInvestigationCase"
  /v1/investigations/{caseId}/challenge-dismissal:
    parameters:
      - $ref: "#/components/parameters/CaseId"
    post:
      operationId: challengeAutoDismissal
      tags: [Investigations]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [alertId, rationale]
              properties:
                alertId:
                  type: string
                rationale:
                  type: string
      responses:
        "201":
          description: Dismissed alert forced into queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeQueuedAlert"
  /v1/baselines:
    get:
      operationId: listBehaviourBaselines
      tags: [Baselines]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Behavioural baselines page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeBehaviourBaseline"
    post:
      operationId: createBehaviourBaseline
      tags: [Baselines]
      description: >-
        Baseline requires population, purpose, and lawful basis before it can
        open investigation cases.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BehaviourBaselineCreate"
      responses:
        "201":
          description: Baseline created pending activation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeBehaviourBaseline"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /v1/baselines/{baselineId}/activate:
    parameters:
      - $ref: "#/components/parameters/BaselineId"
    post:
      operationId: activateBehaviourBaseline
      tags: [Baselines]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Baseline activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeBehaviourBaseline"
  /v1/anomalies:
    get:
      operationId: listAnomalyDetections
      tags: [Baselines]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Anomaly detections page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAnomalyDetection"
  /v1/attack-paths:
    get:
      operationId: listAttackPaths
      tags: [Baselines]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Explainable attack-path rankings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeAttackPath"
  /v1/attack-paths/{pathId}/decision:
    parameters:
      - $ref: "#/components/parameters/PathId"
    post:
      operationId: decideAttackPathRecommendation
      tags: [Baselines]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accepted, rejected]
                rationale:
                  type: string
      responses:
        "200":
          description: Recommendation decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeAttackPath"
  /v1/control-tests:
    get:
      operationId: listControlTests
      tags: [Controls]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, running, passed, failed]
      responses:
        "200":
          description: Control tests page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeControlTest"
    post:
      operationId: scheduleControlTest
      tags: [Controls]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlTestCreate"
      responses:
        "201":
          description: Control test scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeControlTest"
  /v1/control-tests/{testId}/results:
    parameters:
      - $ref: "#/components/parameters/TestId"
    post:
      operationId: recordControlTestResult
      tags: [Controls]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ControlTestResult"
      responses:
        "201":
          description: Result recorded into residual risk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeControlTest"
  /v1/kris:
    get:
      operationId: listKeyRiskIndicators
      tags: [Indicators]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: KRIs with freshness state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeKeyRiskIndicator"
    post:
      operationId: defineKeyRiskIndicator
      tags: [Indicators]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KeyRiskIndicatorCreate"
      responses:
        "201":
          description: KRI defined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeKeyRiskIndicator"
  /v1/kris/{kriId}/refresh:
    parameters:
      - $ref: "#/components/parameters/KriId"
    post:
      operationId: refreshKeyRiskIndicator
      tags: [Indicators]
      security:
        - ApiKeyAuth: []
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceRecord"
      responses:
        "200":
          description: KRI refreshed or degraded for stale coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeKeyRiskIndicator"
  /v1/residual-risk/snapshots:
    get:
      operationId: listResidualRiskSnapshots
      tags: [Reporting]
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Residual risk snapshots against appetite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListEnvelopeResidualRiskSnapshot"
    post:
      operationId: publishResidualRiskSnapshot
      tags: [Reporting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                asOf:
                  type: string
                  format: date-time
                audience:
                  type: string
                  enum: [operations, risk_committee, board]
      responses:
        "201":
          description: Snapshot published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeResidualRiskSnapshot"
  /v1/cyber-risk-appetite:
    get:
      operationId: getCyberRiskAppetite
      tags: [Reporting]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Stated cyber risk appetite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCyberRiskAppetite"
    put:
      operationId: updateCyberRiskAppetite
      tags: [Reporting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CyberRiskAppetite"
      responses:
        "200":
          description: Appetite updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCyberRiskAppetite"
  /v1/committee-packs:
    post:
      operationId: assembleCommitteePack
      tags: [Reporting]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshotId]
              properties:
                snapshotId:
                  type: string
                committee:
                  type: string
                  enum: [audit_risk, board, cyber_steering]
      responses:
        "201":
          description: Committee pack assembled from residual risk evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeCommitteePack"
  /v1/containment-actions:
    post:
      operationId: executeContainmentAction
      tags: [Triage]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContainmentActionCreate"
      responses:
        "202":
          description: Containment accepted with immutable action log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeContainmentAction"
  /v1/containment-actions/{actionId}/override:
    parameters:
      - $ref: "#/components/parameters/ActionId"
    post:
      operationId: overrideContainmentAction
      tags: [Triage]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rationale]
              properties:
                rationale:
                  type: string
      responses:
        "200":
          description: Override recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeContainmentAction"
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    AlertId:
      name: alertId
      in: path
      required: true
      schema:
        type: string
    PolicyId:
      name: policyId
      in: path
      required: true
      schema:
        type: string
    CaseId:
      name: caseId
      in: path
      required: true
      schema:
        type: string
    BaselineId:
      name: baselineId
      in: path
      required: true
      schema:
        type: string
    PathId:
      name: pathId
      in: path
      required: true
      schema:
        type: string
    TestId:
      name: testId
      in: path
      required: true
      schema:
        type: string
    KriId:
      name: kriId
      in: path
      required: true
      schema:
        type: string
    ActionId:
      name: actionId
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResponseMeta:
      type: object
      required: [requestId, timestamp]
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: number
          format: double
        currency:
          type: string
          example: CAD
    SecurityEvent:
      type: object
      required: [id, source, receivedAt]
      properties:
        id:
          type: string
        source:
          type: string
          enum: [siem, edr, identity, threat_intel]
        externalId:
          type: string
        receivedAt:
          type: string
          format: date-time
        attackType:
          type: string
        assetCriticality:
          type: string
          enum: [low, medium, high, critical]
    SecurityEventIngest:
      type: object
      required: [source, externalId]
      properties:
        source:
          type: string
          enum: [siem, edr, identity, threat_intel]
        externalId:
          type: string
        attackType:
          type: string
        assetCriticality:
          type: string
          enum: [low, medium, high, critical]
        rawRef:
          type: string
          description: Pointer into source SIEM; not raw payload
    Alert:
      type: object
      required: [id, eventId, disposition]
      properties:
        id:
          type: string
        eventId:
          type: string
        disposition:
          type: string
          enum: [scored, dismissed, queued, investigating, closed]
        worthScore:
          type: number
          format: float
        vendorSeverity:
          type: string
    EconomicScore:
      type: object
      required: [alertId, expectedLossIfIgnored, estimatedAnalystMinutes, worthScore]
      properties:
        alertId:
          type: string
        expectedLossIfIgnored:
          $ref: "#/components/schemas/Money"
        estimatedAnalystMinutes:
          type: number
          format: float
        worthScore:
          type: number
          format: float
        factors:
          type: object
          additionalProperties:
            type: string
    DismissalPolicy:
      type: object
      required: [id, name, status]
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
          enum: [draft, approved, suspended]
        alertClass:
          type: string
        maxFalseDismissalRate:
          type: number
          format: float
        lastBackTestFalseDismissalRate:
          type: number
          format: float
        ownerId:
          type: string
    DismissalPolicyCreate:
      type: object
      required: [name, alertClass]
      properties:
        name:
          type: string
        alertClass:
          type: string
        rules:
          type: array
          items:
            type: string
        ownerId:
          type: string
    DismissalBackTest:
      type: object
      properties:
        policyId:
          type: string
        windowDays:
          type: integer
        historicalTruePositives:
          type: integer
        wouldHaveDismissed:
          type: integer
        falseDismissalRate:
          type: number
          format: float
        passedGate:
          type: boolean
    TriageShift:
      type: object
