apis:
  identity:
    root: src/identity.yaml
  events:
    root: src/events.yaml
  scoring:
    root: src/scoring.yaml
  triage:
    root: src/triage.yaml
  investigations:
    root: src/investigations.yaml
  baselines:
    root: src/baselines.yaml
  controls:
    root: src/controls.yaml
  indicators:
    root: src/indicators.yaml
  reporting:
    root: src/reporting.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
