openapi: 3.1.0
info:
  title: Alertworth Baselines API
  version: 0.1.0
  description: |
    Behavioural baselines, anomaly detections, and explainable attack paths.
  x-domain: bsl
  x-product: alertworth
servers:
  - url: https://api.alertworth.local
security:
  - apiKey: []
tags:
  - name: Baselines
    description: Behavioural baselines and anomaly detections
paths:
  /v1/baselines:
    get:
      operationId: listBehaviourBaselines
      tags: [Baselines]
      summary: List behaviour baselines
      x-repository: BehaviourBaseline
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Behavioural baselines page
          content:
            application/json:
              schema:
                $ref: ./baselines.schemas.yaml#/components/schemas/BehaviourBaselineListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createBehaviourBaseline
      tags: [Baselines]
      summary: Create behaviour baseline
      description: >
        Baseline requires population, purpose, and lawful basis before it can
        open investigation cases.
      x-repository: BehaviourBaseline
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./baselines.schemas.yaml#/components/schemas/BehaviourBaselineCreate
      responses:
        '201':
          description: Baseline created pending activation
          content:
            application/json:
              schema:
                $ref: ./baselines.schemas.yaml#/components/schemas/BehaviourBaselineResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '422':
          $ref: ./common/responses.yaml#/components/responses/UnprocessableEntity
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/baselines/{baselineId}/activate:
    parameters:
      - name: baselineId
        in: path
        required: true
        schema:
          $ref: ./baselines.schemas.yaml#/components/schemas/BaselineId
    post:
      operationId: activateBehaviourBaseline
      tags: [Baselines]
      summary: Activate behaviour baseline
      x-repository: none
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Baseline activated
          content:
            application/json:
              schema:
                $ref: ./baselines.schemas.yaml#/components/schemas/BehaviourBaselineResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/anomalies:
    get:
      operationId: listAnomalyDetections
      tags: [Baselines]
      summary: List anomaly detections
      x-repository: AnomalyDetection
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Anomaly detections page
          content:
            application/json:
              schema:
                $ref: ./baselines.schemas.yaml#/components/schemas/AnomalyDetectionListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/attack-paths:
    get:
      operationId: listAttackPaths
      tags: [Baselines]
      summary: List attack-path rankings
      x-repository: AttackPath
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
      responses:
        '200':
          description: Explainable attack-path rankings
          content:
            application/json:
              schema:
                $ref: ./baselines.schemas.yaml#/components/schemas/AttackPathListResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/attack-paths/{pathId}/decision:
    parameters:
      - name: pathId
        in: path
        required: true
        schema:
          $ref: ./baselines.schemas.yaml#/components/schemas/PathId
    post:
      operationId: decideAttackPathRecommendation
      tags: [Baselines]
      summary: Decide attack-path recommendation
      x-repository: none
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./baselines.schemas.yaml#/components/schemas/AttackPathDecisionRequest
      responses:
        '200':
          description: Recommendation decided
          content:
            application/json:
              schema:
                $ref: ./baselines.schemas.yaml#/components/schemas/AttackPathResponse
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth
